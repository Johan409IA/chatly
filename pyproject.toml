[project]
name = "chatly"
version = "0.1.0"
description = "chat para grupos puedan tomar decisiones, realizar encuestas y comunicarse con colegas de trabajo de proyecto"
readme = "README.md"
authors = [
    { name = "Johan", email = "johan2a409@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "reflex>=0.10.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
chatly = "chatly:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: pruebas que requieren Supabase (conexión y migración 0001_infra)",
]