name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    # Valores ficticios: la suite unitaria no toca servicios externos, pero
    # importar la app exige que la configuración valide.
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/chatly
      APP_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/chatly
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/chatly
      SUPABASE_URL: https://ci.invalid
      SUPABASE_PUBLISHABLE_KEY: ci
      SUPABASE_JWKS_URL: https://ci.invalid/.well-known/jwks.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          activate-environment: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Compile check
        run: uv run reflex compile --dry
